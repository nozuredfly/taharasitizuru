<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>田原市 地区マップ</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="田原地区マップ">
<meta name="theme-color" content="#1f5f3f">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
#map{position:absolute;inset:0}
.leaflet-top.leaflet-right{margin-top:calc(env(safe-area-inset-top) + 56px)}
#bar{position:absolute;top:calc(env(safe-area-inset-top) + 8px);left:8px;right:8px;z-index:1000;display:flex;gap:6px}
#q{flex:1;font-size:16px;padding:10px 12px;border:1px solid #bbb;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.btn{font-size:15px;padding:0 12px;border:none;border-radius:10px;background:#1f5f3f;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);white-space:nowrap}
#sug{position:absolute;top:calc(env(safe-area-inset-top) + 54px);left:8px;right:8px;z-index:1000;background:#fff;border-radius:10px;max-height:45vh;overflow:auto;box-shadow:0 2px 8px rgba(0,0,0,.25);display:none}
#sug div{padding:10px 12px;border-bottom:1px solid #eee;font-size:15px}
#sug small{color:#888}
#panel{position:absolute;left:0;right:0;bottom:0;z-index:1000;background:#fff;border-radius:14px 14px 0 0;box-shadow:0 -2px 10px rgba(0,0,0,.25);max-height:55vh;display:none;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
#panel.open{display:flex}
#ph{display:flex;align-items:center;gap:6px;padding:10px;border-bottom:1px solid #eee;flex-wrap:wrap}
#ph b{flex:1;font-size:16px}
#ph select,#ph button{font-size:14px;padding:6px 8px;border-radius:8px;border:1px solid #ccc;background:#f7f7f7}
#list{overflow:auto}
.row{display:flex;align-items:center;padding:10px 12px;border-bottom:1px solid #f0f0f0;font-size:15px}
.row span{flex:1}
.row .dist{color:#888;font-size:13px;margin-right:8px}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid #1f5f3f;background:#fff;font-size:16px;color:#fff}
.chk.on{background:#e8590c;border-color:#e8590c}
#fab{position:absolute;right:10px;bottom:calc(env(safe-area-inset-bottom) + 24px);z-index:999;display:flex;flex-direction:column;gap:8px}
#fab .btn{height:46px;min-width:46px;font-size:14px}
.lbl{background:rgba(255,255,255,.85);border:1px solid #1f5f3f;border-radius:6px;padding:1px 5px;font-size:12px;font-weight:bold;color:#1f5f3f;white-space:nowrap;box-shadow:none}
.lbl.done{border-color:#e8590c;color:#e8590c}
.lbl:before{display:none}
.klbl{background:rgba(255,255,255,.7);border:none;font-size:11px;color:#333;padding:0 3px;box-shadow:none}
.klbl:before{display:none}
.pop b{font-size:16px}
.pop a,.pop button{display:inline-block;margin:6px 6px 0 0;padding:6px 10px;border-radius:8px;font-size:14px;text-decoration:none;border:none}
.pop a{background:#1a73e8;color:#fff}
.pop button{background:#e8590c;color:#fff}
.pop .note{color:#888;font-size:12px}
#modal{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:12px}
#modal.open{display:flex}
#mbox{background:#fff;border-radius:14px;padding:16px;width:100%;max-width:440px;max-height:90vh;overflow:auto;font-size:14px}
#mbox h3{margin:0 0 8px;font-size:17px}
#mbox label{display:block;margin:10px 0 4px;font-weight:bold}
#mbox select,#mbox input[type=text]{width:100%;font-size:16px;padding:8px;border:1px solid #ccc;border-radius:8px}
#mbox .acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
#mbox .acts button{flex:1;padding:10px;font-size:15px;border-radius:10px;border:none;background:#eee}
#mbox .acts .pri{background:#1f5f3f;color:#fff}
#mres{margin-top:10px;padding:8px;background:#f4f7f5;border-radius:8px;white-space:pre-wrap;font-size:13px}
.cur{color:#555;font-size:13px;background:#fffbe6;padding:6px 8px;border-radius:8px}
</style>
</head>
<body>
<div id="map"></div>
<div id="bar">
  <input id="q" type="search" placeholder="町名・小字で検索（例：福江、保美）" autocomplete="off">
  <button class="btn" id="listBtn">一覧</button>
</div>
<div id="sug"></div>
<div id="fab">
  <button class="btn" id="popBtn" title="人口表示" style="opacity:.5">人口</button>
  <button class="btn" id="kzBtn" title="小字表示">小字</button>
  <button class="btn" id="locBtn" title="現在地">現在地</button>
</div>
<div id="panel">
  <div id="ph">
    <b id="cnt">町一覧</b>
    <select id="sort">
      <option value="kana">名前順</option>
      <option value="ew">東→西</option>
      <option value="we">西→東</option>
      <option value="near">現在地から近い順</option>
      <option value="pop">人口の多い順</option>
    </select>
    <button id="popUpd">人口データ更新</button>
    <button id="reset">チェック全解除</button>
    <button id="close">閉じる</button>
  </div>
  <div id="list"></div>
</div>
<div id="modal"><div id="mbox">
  <h3>人口データの更新</h3>
  <div class="cur" id="mcur"></div>
  <label>① 市の「地区別人口世帯表」Excel（またはCSV）を選ぶ</label>
  <input type="file" id="mfile" accept=".xlsx,.xls,.csv">
  <div id="mcols" style="display:none">
    <label>② 人口の列</label><select id="mpop"></select>
    <label>③ 世帯数の列</label><select id="mhh"></select>
    <label>④ 基準日（表示用）</label><input type="text" id="mdate" placeholder="例：令和8年10月31日現在">
  </div>
  <div id="mres"></div>
  <div class="acts">
    <button class="pri" id="mapply" disabled>この内容で反映</button>
    <button id="mrevert">国勢調査に戻す</button>
    <button id="mclose">閉じる</button>
  </div>
</div></div>

const gsiPhoto = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg', { maxZoom:18, attribution:'<a href="https://maps.gsi.go.jp/development/ichiran.html">地理院タイル</a>' });
const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, attribution:'&copy; OpenStreetMap contributors' });
gsiStd.addTo(map);
L.control.layers({ '地理院 標準地図':gsiStd, '航空写真':gsiPhoto, 'OpenStreetMap':osm }, null, { position:'topright' }).addTo(map);
map.attributionControl.setPosition('bottomleft');

const color = n => done[n] ? '#e8590c' : '#1f5f3f';
const gmap = (la, ln) => `https://www.google.com/maps/dir/?api=1&destination=${la},${ln}`;

// 町マーカー
const townMarkers = {};
TOWNS.forEach(([n, la, ln]) => {
  const m = L.circleMarker([la, ln], { radius:8, color:'#fff', weight:2, fillColor:color(n), fillOpacity:1 }).addTo(map);
  m.bindTooltip(n, { permanent:true, direction:'right', offset:[8,0], className:'lbl' + (done[n] ? ' done' : '') });
  m.bindPopup(() => popupHtml(n, la, ln));
  townMarkers[n] = m;
});
const fmt = v => v.toLocaleString('ja-JP');
function popTxt(n) {
  const d = POP[n];
  if (!d) return '<div style="margin:4px 0">人口：<span class="note">データなし</span></div>';
  return `<div style="margin:4px 0">人口 <b>${fmt(d[0])}</b>人／${fmt(d[1])}世帯${d[2] ? `<br><span class="note">※${d[2]}</span>` : ''}<br><span class="note">${POP_LABEL}</span></div>`;
}
let popOn = false;
function labelTxt(n) { return popOn && POP[n] ? `${n} ${fmt(POP[n][0])}人` : n; }
function radius(n) { if (!popOn) return 8; const d = POP[n]; return d ? Math.max(6, Math.min(30, Math.sqrt(d[0]) / 3)) : 5; }
function applyPop() {
  Object.keys(townMarkers).forEach(n => { const m = townMarkers[n]; m.setRadius(radius(n)); m.setTooltipContent(labelTxt(n)); m.setStyle({ fillOpacity: popOn ? .75 : 1 }); });
}
function popupHtml(n, la, ln) {
  const k = KOAZA.filter(x => TOWNS[x[0]][0] === n).length;
  return `<div class="pop"><b>田原市 ${n}</b><br>
  ${popTxt(n)}
  <span class="note">${la.toFixed(5)}, ${ln.toFixed(5)}（町の代表点）／小字 ${k}件</span><br>
  <a href="${gmap(la, ln)}" target="_blank">ナビ</a>
  <button onclick="toggleDone('${n}')">${done[n] ? 'チェック解除' : '配送チェック'}</button></div>`;
}
function toggleDone(n) {
  if (done[n]) delete done[n]; else done[n] = Date.now();
  save();
  const m = townMarkers[n];
  m.setStyle({ fillColor:color(n) });
  m.getTooltip().getElement()?.classList.toggle('done', !!done[n]);
  m.closePopup();
  renderList();
}
window.toggleDone = toggleDone;

// 小字レイヤー（ズーム13以上で表示）
const kzLayer = L.layerGroup(); const kzMk = [];
let kzOn = true;
KOAZA.forEach(([ti, n, la, ln]) => {
  const m = L.circleMarker([la, ln], { radius:3, color:'#555', weight:1, fillColor:'#ffd43b', fillOpacity:1 });
  m.bindTooltip(n, { permanent:true, direction:'top', offset:[0,-3], className:'klbl' });
  m.bindPopup(`<div class="pop"><b>${TOWNS[ti][0]} ${n}</b><br><span class="note">${la.toFixed(5)}, ${ln.toFixed(5)}（小字の代表点）</span><br><a href="${gmap(la, ln)}" target="_blank">ナビ</a></div>`);
  kzLayer.addLayer(m); kzMk.push(m);
});
function updKz() {
  const show = kzOn && map.getZoom() >= 13;
  if (show && !map.hasLayer(kzLayer)) map.addLayer(kzLayer);
  if (!show && map.hasLayer(kzLayer)) map.removeLayer(kzLayer);
}
map.on('zoomend', updKz);
document.getElementById('popBtn').onclick = e => { popOn = !popOn; e.target.style.opacity = popOn ? 1 : .5; applyPop(); renderList(); };
document.getElementById('kzBtn').onclick = e => {
  kzOn = !kzOn; e.target.style.opacity = kzOn ? 1 : .5; updKz();
  if (kzOn && map.getZoom() < 13) alertMsg('小字は拡大（ズーム）すると表示されます');
};
function alertMsg(t) { const s = document.getElementById('sug'); s.innerHTML = `<div>${t}</div>`; s.style.display = 'block'; setTimeout(() => s.style.display = 'none', 2000); }

// 検索
const q = document.getElementById('q'), sug = document.getElementById('sug');
q.addEventListener('input', () => {
  const v = q.value.trim();
  if (!v) { sug.style.display = 'none'; return; }
  const res = [];
  TOWNS.forEach(([n, la, ln]) => { if (n.includes(v.replace(/[\s　]+/g,''))) res.push({ t:n, s:'町', la, ln, z:15, town:n }); });
  const terms = v.split(/[\s　]+/).filter(Boolean), vj = terms.join('');
  KOAZA.forEach(([ti, n, la, ln], ki) => {
    const full = TOWNS[ti][0] + n, alt = TOWNS[ti][0].replace(/町$/, '') + n;
    if (full.includes(vj) || alt.includes(vj) || terms.every(t => full.includes(t))) res.push({ t:TOWNS[ti][0] + ' ' + n, s:'小字', la, ln, z:17, ki });
  });
  sug.innerHTML = res.slice(0, 40).map((r, i) => `<div data-i="${i}">${r.t} <small>${r.s}</small></div>`).join('') || '<div>見つかりません</div>';
  sug.style.display = 'block';
  sug.querySelectorAll('[data-i]').forEach(d => d.onclick = () => {
    const r = res[d.dataset.i]; sug.style.display = 'none'; q.blur();
    map.flyTo([r.la, r.ln], r.z);
    if (r.town) setTimeout(() => townMarkers[r.town].openPopup(), 800);
    if (r.ki !== undefined) { kzOn = true; setTimeout(() => { updKz(); kzMk[r.ki].openPopup(); }, 900); }
  });
});

// 現在地
let here = null, hereMk = null;
function locate(cb) {
  if (!navigator.geolocation) return alertMsg('位置情報が使えません');
  navigator.geolocation.getCurrentPosition(p => {
    here = [p.coords.latitude, p.coords.longitude];
    if (hereMk) hereMk.setLatLng(here); else hereMk = L.circleMarker(here, { radius:9, color:'#fff', weight:3, fillColor:'#1a73e8', fillOpacity:1 }).addTo(map).bindTooltip('現在地');
    cb && cb();
  }, () => alertMsg('現在地を取得できませんでした'), { enableHighAccuracy:true, timeout:10000 });
}
document.getElementById('locBtn').onclick = () => locate(() => map.flyTo(here, 14));

// 一覧
const panel = document.getElementById('panel'), sortSel = document.getElementById('sort');
const km = (a, b, c, d) => { const r = Math.PI / 180, x = (d - b) * r * Math.cos((a + c) / 2 * r), y = (c - a) * r; return Math.sqrt(x * x + y * y) * 6371; };
function renderList() {
  let arr = TOWNS.map(t => t.slice());
  const s = sortSel.value;
  if (s === 'ew') arr.sort((a, b) => b[2] - a[2]);
  else if (s === 'we') arr.sort((a, b) => a[2] - b[2]);
  else if (s === 'near' && here) arr.sort((a, b) => km(here[0], here[1], a[1], a[2]) - km(here[0], here[1], b[1], b[2]));
  else if (s === 'pop') arr.sort((a, b) => (POP[b[0]]?.[0] ?? -1) - (POP[a[0]]?.[0] ?? -1));
  else arr.sort((a, b) => a[0].localeCompare(b[0], 'ja'));
  const n = Object.keys(done).length;
  document.getElementById('cnt').textContent = `${TOWNS.length}町（済 ${n}）`;
  document.getElementById('list').innerHTML = arr.map(([nm, la, ln]) =>
    `<div class="row" data-n="${nm}"><span>${nm}</span>${(popOn || s === 'pop') && POP[nm] ? `<span class="dist">${fmt(POP[nm][0])}人</span>` : ''}${here ? `<span class="dist">${km(here[0], here[1], la, ln).toFixed(1)}km</span>` : ''}<button class="chk ${done[nm] ? 'on' : ''}" data-c="${nm}">${done[nm] ? '✓' : ''}</button></div>`).join('');
}
document.getElementById('list').onclick = e => {
  const c = e.target.closest('[data-c]');
  if (c) { toggleDone(c.dataset.c); return; }
  const r = e.target.closest('[data-n]');
  if (r) { const m = townMarkers[r.dataset.n]; map.flyTo(m.getLatLng(), 15); setTimeout(() => m.openPopup(), 800); }
};
sortSel.onchange = () => { if (sortSel.value === 'near' && !here) locate(renderList); else renderList(); };
document.getElementById('listBtn').onclick = () => { map.closePopup(); panel.classList.toggle('open'); renderList(); };
document.getElementById('close').onclick = () => panel.classList.remove('open');
document.getElementById('reset').onclick = () => {
  if (!confirm('配送チェックをすべて解除しますか？')) return;
  done = {}; save();
  Object.keys(townMarkers).forEach(n => { townMarkers[n].setStyle({ fillColor:color(n) }); townMarkers[n].getTooltip().getElement()?.classList.remove('done'); });
  renderList();
};
map.on('click', () => { sug.style.display = 'none'; });

// ===== 人口データ取り込み =====
const modal = document.getElementById('modal'), mres = document.getElementById('mres');
const KANJI = ['', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
const TOWNSET = new Set(TOWNS.map(t => t[0]));
function normName(s) {
  s = String(s ?? '').normalize('NFKC').replace(/[\s　]/g, '').replace(/^田原市/, '');
  s = s.replace(/([0-9])丁目/g, (m, d) => KANJI[+d] + '丁目');
  return s;
}
function matchTown(s) {
  if (!s) return null;
  if (TOWNSET.has(s)) return s;
  if (TOWNSET.has(s + '町')) return s + '町';
  return null;
}
const toNum = v => { const n = Number(String(v ?? '').normalize('NFKC').replace(/[,，人世帯\s]/g, '')); return isFinite(n) && String(v ?? '').trim() !== '' ? n : null; };
let sheetRows = null, rowTown = null;
function loadXLSX() {
  return new Promise((ok, ng) => {
    if (window.XLSX) return ok();
    const s = document.createElement('script');
    s.src = 'https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';
    s.onload = ok; s.onerror = () => ng(new Error('Excel読込ライブラリを取得できません（通信を確認）'));
    document.head.appendChild(s);
  });
}
function openModal() {
  document.getElementById('mcur').textContent = '現在のデータ：' + POP_LABEL;
  modal.classList.add('open');
}
document.getElementById('popUpd').onclick = openModal;
document.getElementById('mclose').onclick = () => modal.classList.remove('open');
document.getElementById('mfile').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  mres.textContent = '読み込み中…'; document.getElementById('mapply').disabled = true;
  try {
    await loadXLSX();
    const wb = XLSX.read(await f.arrayBuffer(), { type:'array' });
    // 町名が一番多く見つかるシートを使う
    let best = null;
    wb.SheetNames.forEach(sn => {
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header:1, defval:'', raw:true });
      const at = (r, i) => {
        const a = normName(r[i]); if (!a) return null;
        const b = normName(r[i + 1]).replace(/([0-9])丁目/, (m, d) => KANJI[+d] + '丁目');
        if (/^[一二三四五六七八九]丁目$/.test(b)) { const t = matchTown(a + b); if (t) return t; }
        return matchTown(a);
      };
      // 町名が最も多く並ぶ列を「町名列」とする
      const freq = {};
      rows.forEach(r => r.forEach((v, i) => { const t = at(r, i); if (t) (freq[i] = freq[i] || new Set()).add(t); }));
      const col = Object.keys(freq).sort((a, b) => freq[b].size - freq[a].size)[0];
      const rt = rows.map(r => { if (col === undefined) return null; const t = at(r, +col); return t ? { t, c:+col } : null; });
      const n = new Set(rt.filter(Boolean).map(x => x.t)).size;
      if (!best || n > best.n) best = { sn, rows, rt, n };
    });
    if (!best || best.n === 0) { mres.textContent = '町名が見つかりませんでした。町別の表ではない可能性があります。'; return; }
    sheetRows = best.rows; rowTown = best.rt;
    // 列候補（見出し＝最初の町名行より上のセルを連結）
    const first = rowTown.findIndex(Boolean);
    const ncol = Math.max(...sheetRows.map(r => r.length));
    const heads = [];
    for (let c = 0; c < ncol; c++) {
      const hd = sheetRows.slice(Math.max(0, first - 4), first).map(r => String(r[c] ?? '').trim()).filter(Boolean).join(' ');
      const samp = sheetRows[first]?.[c];
      if (toNum(samp) !== null) heads.push({ c, label: `${String.fromCharCode(65 + (c % 26))}列 ${hd || ''}（例 ${samp ?? ''}）` });
    }
    const opt = heads.map(x => `<option value="${x.c}">${x.label}</option>`).join('');
    const mp = document.getElementById('mpop'), mh = document.getElementById('mhh');
    mp.innerHTML = opt; mh.innerHTML = opt;
    const hd = c => heads.find(x => x.c === c)?.label || '';
    const pc = heads.find(x => /人口/.test(x.label) && /(計|総数|合計)/.test(x.label)) || heads.find(x => /(総数|合計|計)/.test(x.label) && !/世帯/.test(x.label)) || heads.find(x => /人口/.test(x.label));
    const hc = heads.find(x => /世帯/.test(x.label));
    if (pc) mp.value = pc.c; if (hc) mh.value = hc.c;
    // 基準日を探す
    const txt = sheetRows.slice(0, first).flat().map(v => String(v)).join(' ').normalize('NFKC');
    const dm = txt.match(/(令和|平成)\s*[0-9元]+\s*年\s*[0-9]+\s*月\s*[0-9]+\s*日(現在)?/);
    document.getElementById('mdate').value = dm ? dm[0].replace(/\s/g, '') + (dm[2] ? '' : '現在') : f.name;
    document.getElementById('mcols').style.display = 'block';
    mp.onchange = mh.onchange = preview;
    preview();
  } catch(err) { mres.textContent = 'エラー：' + err.message; }
};
let pending = null;
function preview() {
  const pc = +document.getElementById('mpop').value, hc = +document.getElementById('mhh').value;
  const data = {};
  rowTown.forEach((x, i) => {
    if (!x || data[x.t]) return;
    const p = toNum(sheetRows[i][pc]), hh = toNum(sheetRows[i][hc]);
    if (p !== null) data[x.t] = [p, hh ?? 0];
  });
  const got = Object.keys(data), miss = TOWNS.map(t => t[0]).filter(n => !data[n]);
  const sp = got.reduce((a, n) => a + data[n][0], 0), sh = got.reduce((a, n) => a + data[n][1], 0);
  const ex = ['田原町', '福江町', '赤羽根町'].filter(n => data[n]).map(n => `${n} ${fmt(data[n][0])}人／${fmt(data[n][1])}世帯`).join('\n');
  mres.textContent = `一致：${got.length} / ${TOWNS.length}町\n合計：${fmt(sp)}人／${fmt(sh)}世帯\n${ex}` + (miss.length ? `\n見つからない町：${miss.join('、')}` : '') + '\n※数字が人口・世帯と合っているか確認してから反映してください';
  pending = got.length ? data : null;
  document.getElementById('mapply').disabled = !pending;
}
document.getElementById('mapply').onclick = () => {
  if (!pending) return;
  POP = pending; POP_LABEL = document.getElementById('mdate').value.trim() || '更新データ';
  try { localStorage.setItem(POP_KEY, JSON.stringify({ data:POP, label:POP_LABEL })); } catch(e) {}
  applyPop(); renderList(); modal.classList.remove('open');
  alertMsg('人口データを更新しました（' + POP_LABEL + '）');
};
document.getElementById('mrevert').onclick = () => {
  POP = POP_CENSUS; POP_LABEL = '令和2年国勢調査';
  try { localStorage.removeItem(POP_KEY); } catch(e) {}
  applyPop(); renderList(); openModal(); mres.textContent = '国勢調査のデータに戻しました';
};

// PWA用アイコン・マニフェスト（1ファイル完結）
(function () {
  const c = document.createElement('canvas'); c.width = c.height = 192;
  const x = c.getContext('2d');
  x.fillStyle = '#1f5f3f'; x.fillRect(0, 0, 192, 192);
  x.fillStyle = '#fff'; x.font = 'bold 72px sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText('田原', 96, 86); x.font = 'bold 34px sans-serif'; x.fillText('地区MAP', 96, 150);
  const icon = c.toDataURL('image/png');
  const l1 = document.createElement('link'); l1.rel = 'apple-touch-icon'; l1.href = icon; document.head.appendChild(l1);
  const man = { name:'田原市 地区マップ', short_name:'田原地区マップ', start_url:location.href.split('#')[0], display:'standalone', background_color:'#ffffff', theme_color:'#1f5f3f', icons:[{ src:icon, sizes:'192x192', type:'image/png' }] };
  const l2 = document.createElement('link'); l2.rel = 'manifest';
  l2.href = URL.createObjectURL(new Blob([JSON.stringify(man)], { type:'application/json' }));
  document.head.appendChild(l2);
})();
</script>
</body>
